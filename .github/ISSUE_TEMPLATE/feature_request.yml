name: Feature request / 功能建议
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve? / 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议的做法
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 其他方案
